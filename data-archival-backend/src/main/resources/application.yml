server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: data-archival-purging
  
  datasource:
    url: jdbc:mysql://localhost:3306/data_archival_live?useSSL=false&serverTimezone=IST&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: DataArchivalScheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            useProperties: false
            misfireThreshold: 60000
            clusterCheckinInterval: 5000
            isClustered: true
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true

# Archival Database Configuration
archival:
  datasource:
    url: jdbc:mysql://localhost:3306/data_archival_archive?useSSL=false&serverTimezone=IST&allowPublicKeyRetrieval=true
    username: ${ARCHIVAL_DB_USERNAME:root}
    password: ${ARCHIVAL_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Scheduler Configuration
scheduler:
  timezone: Asia/Kolkata
  cron:
    archival: "0 0 0 * * ?"  # 12:00 AM IST daily

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey}
  expiration: 86400000  # 24 hours

# Logging Configuration
logging:
  level:
    com.dataarchival: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/data-archival.log

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always